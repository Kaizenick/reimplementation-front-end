x-frontend-common: &frontend-common
  ports:
    - "8080:80"
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend-local:
    <<: *frontend-common
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expertiza-frontend

  frontend-prod:
    <<: *frontend-common
    profiles: ["prod"]
    image: ${EXPERTIZA_FRONTEND_IMAGE:-ghcr.io/expertiza/reimplementation-front-end:latest}
    container_name: expertiza-frontend-prod
